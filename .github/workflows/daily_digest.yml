name: Daily Pooja & Aarti WhatsApp Digest

on:
  schedule:
    # 22:30 UTC = 04:00 AM IST (UTC + 5:30)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional date to generate summary for (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  dispatch_digest:
    name: Dispatch 4:00 AM WhatsApp Summary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Summary Script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SHEET_KEY: ${{ secrets.GOOGLE_SHEET_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          ADMIN_WHATSAPP_NUMBER: ${{ secrets.ADMIN_WHATSAPP_NUMBER }}
          FESTIVAL_START_DATE: ${{ secrets.FESTIVAL_START_DATE }}
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python daily_summary.py --date "${{ github.event.inputs.target_date }}"
          else
            python daily_summary.py
          fi
